<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Gallery</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS riêng -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <h1 class="text-center my-4">Gallery</h1>

    <div class="row gallery">

        <div class="gallery-item">
            <img src="images/1.jpg" alt="Ảnh 1">
        </div>

        <div class="gallery-item">
            <img src="images/2.jpg" alt="Ảnh 2">
        </div>

        <div class="gallery-item">
            <img src="images/3.jpg" alt="Ảnh 3">
        </div>

        <div class="gallery-item">
            <img src="images/4.jpg" alt="Ảnh 4">
        </div>

        <div class="gallery-item">
            <img src="images/5.jpg" alt="Ảnh 5">
        </div>

        <div class="gallery-item">
            <img src="images/6.jpg" alt="Ảnh 6">
        </div>

        <div class="gallery-item">
            <img src="images/7.jpg" alt="Ảnh 7">
        </div>

        <div class="gallery-item">
            <img src="images/8.jpg" alt="Ảnh 8">
        </div>

    </div>
</div>

</body>
</html>
